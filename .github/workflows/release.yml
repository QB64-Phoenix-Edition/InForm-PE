name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    name: Build Release
    uses: ./.github/workflows/build.yml
    with:
      build_type: release
      artifact_prefix: asset-

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "asset-*"
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: true
          prerelease: false
