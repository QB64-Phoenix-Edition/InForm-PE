name: Build and Test

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    name: Build & Test
    uses: ./.github/workflows/build.yml
    with:
      build_type: test
      artifact_prefix: InForm-PE-
